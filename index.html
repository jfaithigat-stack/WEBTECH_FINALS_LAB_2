<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Score Evaluator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="container">
    <h1>Score Evaluator</h1>

    <div id="result" class="hidden">
      <p><strong>Name:</strong> <span id="nameOut"></span></p>
      <p><strong>Score:</strong> <span id="scoreOut"></span></p>
      <p><strong>Remark:</strong> <span id="remarkOut"></span></p>
      <button onclick="resetPage()">Try Again</button>
    </div>

    <p id="message" class="hidden"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
